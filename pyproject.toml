[project]
name = "yoast-seo-mcp"
version = "0.1.0"
description = "MCP server for Yoast SEO: read-only SEO metadata and scores for WordPress."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "httpx==0.28.1",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/RosenAdvertising/yoast-mcp"
Repository = "https://github.com/RosenAdvertising/yoast-mcp"
Issues = "https://github.com/RosenAdvertising/yoast-mcp/issues"

[project.scripts]
yoast-mcp-setup = "yoast_mcp.setup:setup"
yoast-mcp-verify = "yoast_mcp.setup:verify"
yoast-mcp = "yoast_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx==0.23.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yoast_mcp"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
